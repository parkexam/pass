<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>공무원 전문 국가 자격증 한능검 기출문제</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ========== 1. 디자인 토큰 (색상·글꼴·간격은 여기서만 변경) ========== */
:root{
  --bg:#F2F4F6;--surface:#FFF;--ink:#1B2A41;--muted:#5E6C7E;--line:#DDE3EA;
  --accent:#2F6F63;--on-accent:#FFF;--accent-soft:#E3F1ED;--brass:#B08D57;
  --bad:#B4534B;--bad-soft:#F8E8E6;--r:16px;
  --sans:"Noto Sans KR",system-ui,sans-serif;--serif:"Noto Serif KR",Georgia,serif;
  --tab-h:64px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1620;--surface:#17212D;--ink:#E8ECF1;--muted:#8FA0B3;--line:#263445;--accent:#5FB5A3;--on-accent:#0F1620;
  --accent-soft:#16322D;--brass:#C9A56B;--bad:#E08A82;--bad-soft:#3A2223;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1620;--surface:#17212D;--ink:#E8ECF1;--muted:#8FA0B3;--line:#263445;--accent:#5FB5A3;--on-accent:#0F1620;
  --accent-soft:#16322D;--brass:#C9A56B;--bad:#E08A82;--bad-soft:#3A2223;color-scheme:dark}
/* ========== 2. 기본 ========== */
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.app.noTab{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.serif{font-family:var(--serif)}.muted{color:var(--muted)}.sm{font-size:13px}
h1{font:700 26px/1.4 var(--serif);letter-spacing:-.01em}
h2{font:700 17px/1.4 var(--sans);margin:26px 0 12px}
/* ========== 3. 공통 컴포넌트 ========== */
.card{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}
.chip{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips>*{flex:none}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}
.back{padding:4px 12px 4px 0;font-size:14px;color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.num{font:700 28px/1.2 var(--serif);color:var(--accent)}
.stat{flex:1;text-align:center}.stat small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:30}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:6px 0 12px}
label{font-size:13px;color:var(--muted)}
/* ========== 4. 하단 탭 ========== */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ========== 5. 화면별 ========== */
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:22px;margin:6px 0 4px}
.hero .bar{background:rgba(255,255,255,.2)}
.opt{display:flex;gap:14px;width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);line-height:1.5}
.opt .n{font-family:var(--serif);color:var(--muted);width:20px;flex:none}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}.opt.sel .n{color:var(--accent);font-weight:700}
.opt.ok{background:var(--accent-soft);border-color:var(--accent)}.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.q{font:500 19px/1.75 var(--serif);margin:8px 0 22px;white-space:pre-line}
.qbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:20}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:500;text-align:center}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.cell.cur{border-color:var(--ink);border-width:2px}
.cell.o{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.cell.x{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.score{font:700 64px/1.1 var(--serif)}
.exp{margin-top:10px;padding:12px 14px;border-left:3px solid var(--brass);background:var(--bg);border-radius:0 10px 10px 0;font-size:14px}
.plan{border:1.5px solid var(--line)}.plan.best{border-color:var(--brass)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}.seg button{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:13px;color:var(--muted)}.seg .on{background:var(--surface);color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========== A. 샘플 데이터 (실제 연동 시 이 객체를 API/Firebase 결과로 교체) ========== */
const DATA={
  user:{name:"수험생",goal:"2027 국가직 9급",streak:5,todaySolved:12,totalSolved:248,accuracy:72,pass:{type:"subject",until:"2027-03-31"},owned:["한국사","국어"]},
  exams:[
    {id:"civil",name:"공무원",desc:"국가직·지방직 9급/7급",subjects:["국어","영어","한국사","헌법","행정법"]},
    {id:"leet",name:"LEET",desc:"법학적성시험",subjects:["언어이해","추리논증"]},
    {id:"cert",name:"국가자격증",desc:"기사·산업기사·전문자격",subjects:["정보처리기사","전기기사","사회복지사 1급"]},
    {id:"hist",name:"한국사능력검정",desc:"한능검 심화·기본",subjects:["한국사"]}],
  years:[2025,2024,2023,2022],
  questions:[
    {id:1,s:"국어",q:"다음 중 맞춤법이 옳은 것은?",c:["몇 일 동안 쉬었다","며칠 동안 쉬었다","몇일 동안 쉬었다","메칠 동안 쉬었다"],a:1,e:"‘며칠’은 한 단어로 쓰며 ‘몇 일’로 쓰지 않습니다."},
    {id:2,s:"한국사",q:"훈민정음을 창제하여 반포한 조선의 왕은?",c:["태종","세종","세조","성종"],a:1,e:"세종은 1443년 창제, 1446년에 반포했습니다."},
    {id:3,s:"한국사",q:"『경국대전』이 완성되어 반포된 때의 왕은?",c:["세조","예종","성종","중종"],a:2,e:"세조 때 편찬을 시작해 성종 때 완성·반포되었습니다."},
    {id:4,s:"영어",q:"밑줄 친 단어와 의미가 가장 가까운 것은?\n\nHe is a diligent student.",c:["lazy","hardworking","careless","shy"],a:1,e:"diligent는 ‘근면한, 성실한’이라는 뜻입니다."},
    {id:5,s:"헌법",q:"헌법상 헌법개정안의 국회 의결 요건으로 옳은 것은?",c:["재적의원 과반수 찬성","재적의원 3분의 2 이상 찬성","출석의원 과반수 찬성","재적의원 5분의 3 이상 찬성","출석의원 3분의 2 이상 찬성"],a:1,e:"국회 재적의원 3분의 2 이상의 찬성이 필요합니다."},
    {id:6,s:"행정법",q:"행정법의 법원 중 성문법원이 아닌 것은?",c:["헌법","법률","관습법","조례"],a:2,e:"관습법은 불문법원입니다."}],
  plans:[
    {id:"subject",name:"과목별 이용권",price:"4,900원",per:"과목당 · 90일",desc:"원하는 과목만 골라 구매"},
    {id:"month",name:"프리패스 1개월",price:"12,900원",per:"전 과목 무제한",desc:"모든 시험·과목 이용"},
    {id:"year",name:"프리패스 12개월",price:"99,000원",per:"월 8,250원 꼴",desc:"가장 합리적인 선택",best:true}],
  wrongIds:[3,6],
  recent:[{title:"2024 한국사 기출",score:"4 / 5",when:"오늘"},{title:"2023 국어 기출",score:"3 / 5",when:"어제"}]
};
/* ========== B. 상태 ========== */
const S={view:"home",sel:{exam:null,subj:null,year:null},quiz:null,result:null,open:{},palette:false,adminSeg:"시험",adminForm:false,toast:""};
const TABS=[["home","홈","M3 11l9-8 9 8v10h-6v-6H9v6H3z"],["select","시험","M4 5h16M4 12h16M4 19h10"],["wrong","오답노트","M5 3h14v18H5zM9 8h6M9 12h6"],["pass","이용권","M3 7h18v4a2 2 0 000 4v4H3v-4a2 2 0 000-4z"],["my","마이","M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0"]];
const NO_TAB=["quiz","result","admin"];
const byId=id=>DATA.questions.find(q=>q.id==id);
const L="①②③④⑤";
/* ========== C. 컴포넌트 (HTML 문자열 반환 함수) ========== */
const C={
  chips:(arr,on,act)=>`<div class="chips">${arr.map(x=>`<button class="chip ${x==on?"on":""}" data-act="${act}" data-v="${x}">${x}</button>`).join("")}</div>`,
  item:(t,sub,act,v,right="›")=>`<button class="card row between" data-act="${act}" data-v="${v}"><span class="grow"><b style="font-weight:500">${t}</b><span class="muted sm" style="display:block">${sub||""}</span></span><span class="muted">${right}</span></button>`,
  top:(title,backAct)=>`<div class="topbar"><div class="row">${backAct?`<button class="back" data-act="${backAct}">← 뒤로</button>`:""}<b>${title}</b></div></div>`,
  bar:(p)=>`<div class="bar"><i style="width:${p}%"></i></div>`
};
/* ========== D. 화면 ========== */
const V={};
V.home=()=>{const u=DATA.user;return `
  <div class="topbar"><span class="muted sm">기출 한 걸음</span><span class="badge">연속 ${u.streak}일</span></div>
  <h1>${u.name}님,<br>오늘도 한 걸음 더</h1>
  <div class="hero"><div class="row between"><span class="sm" style="opacity:.8">오늘 푼 문제</span><span class="sm" style="opacity:.8">목표 ${u.goal}</span></div>
    <div class="serif" style="font-size:40px;font-weight:700;margin:4px 0 10px">${u.todaySolved}<span style="font-size:16px;opacity:.7"> / 20문제</span></div>${C.bar(u.todaySolved/20*100)}</div>
  <div class="row" style="margin:16px 0"><div class="stat"><div class="num">${u.totalSolved}</div><small>누적 풀이</small></div><div class="stat"><div class="num">${u.accuracy}%</div><small>평균 정답률</small></div><div class="stat"><div class="num">${DATA.wrongIds.length}</div><small>복습할 오답</small></div></div>
  <button class="btn" data-act="startQuick">이어서 풀기</button>
  <h2>시험 카테고리</h2>${DATA.exams.map(e=>C.item(e.name,e.desc,"pickExam",e.id)).join("")}
  <h2>최근 풀이</h2>${DATA.recent.map(r=>`<div class="card row between"><span><b style="font-weight:500">${r.title}</b><span class="muted sm" style="display:block">${r.when}</span></span><span class="serif" style="font-weight:700">${r.score}</span></div>`).join("")}`};
V.select=()=>{const s=S.sel,ex=DATA.exams.find(e=>e.id==s.exam);
  let step=!s.exam?1:!s.subj?2:!s.year?3:4,body="",title=["시험 종류","과목","연도","시험지"][step-1];
  if(step==1)body=DATA.exams.map(e=>C.item(e.name,e.desc,"pickExam",e.id)).join("");
  if(step==2)body=ex.subjects.map(x=>C.item(x,DATA.user.owned.includes(x)?"이용 중":"샘플 문항 제공","pickSubj",x)).join("");
  if(step==3)body=DATA.years.map(y=>C.item(y+"년","기출 2회분","pickYear",y)).join("");
  if(step==4)body=["상반기","하반기"].map(h=>`<div class="card row between"><span><b style="font-weight:500">${s.year}년 ${h}</b><span class="muted sm" style="display:block">${s.subj} · ${pool().length}문항</span></span><button class="btn sm" data-act="startPaper">풀기</button></div>`).join("");
  return `<h1>${title} 선택</h1><p class="muted sm" style="margin:6px 0 18px">${[ex&&ex.name,s.subj,s.year].filter(Boolean).join(" › ")||"풀고 싶은 시험을 골라주세요"}</p>${step>1?`<button class="back" data-act="selBack">← 이전 단계</button>`:""}<div style="margin-top:8px">${body}</div>`};
const pool=()=>{const p=DATA.questions.filter(q=>q.s==S.sel.subj);return p.length?p:DATA.questions.slice(0,5)};
V.quiz=()=>{const z=S.quiz,q=z.list[z.i],left=z.list.length-z.ans.filter(a=>a!=null).length;return `
  <div class="topbar"><button class="back" data-act="quit">✕ 그만두기</button><span class="muted sm">남은 문제 ${left}개</span></div>
  ${C.bar((z.i+1)/z.list.length*100)}
  <div class="row between" style="margin-top:16px"><span class="badge">${q.s}</span><span class="muted sm">${z.i+1} / ${z.list.length}</span></div>
  <p class="q">${q.q}</p>
  ${q.c.map((c,i)=>`<button class="opt ${z.ans[z.i]===i?"sel":""}" data-act="pick" data-v="${i}"><span class="n">${L[i]}</span><span>${c}</span></button>`).join("")}
  ${S.palette?`<div class="card" style="margin-top:16px"><b class="sm">문제 이동</b><div class="grid" style="margin-top:10px">${z.list.map((_,i)=>`<button class="cell ${z.ans[i]!=null?"done":""} ${i==z.i?"cur":""}" data-act="jump" data-v="${i}">${i+1}</button>`).join("")}</div></div>`:""}
  <div class="qbar"><button class="btn ghost" style="width:auto;padding:15px 16px" data-act="prev" ${z.i?"":"disabled"}>‹</button><button class="btn ghost" style="width:auto;padding:15px 16px" data-act="palette">▦</button>
  ${z.i<z.list.length-1?`<button class="btn" data-act="next">다음</button>`:`<button class="btn" data-act="submit">제출하기</button>`}</div>`};
V.result=()=>{const r=S.result,n=r.list.length,ok=r.list.filter((q,i)=>r.ans[i]===q.a).length;return `
  ${C.top("채점 결과")}
  <div class="score">${ok}<span class="muted" style="font-size:26px"> / ${n}</span></div>
  <p class="muted" style="margin:6px 0 16px">정답률 ${Math.round(ok/n*100)}% · ${ok==n?"모두 맞혔어요":"틀린 문제는 오답노트에 담겼어요"}</p>${C.bar(ok/n*100)}
  <h2>문제별 정오표</h2><div class="grid">${r.list.map((q,i)=>{const g=r.ans[i]===q.a;return `<div class="cell ${g?"o":"x"}">${i+1}<br>${g?"○":"✕"}</div>`}).join("")}</div>
  <div class="qbar"><button class="btn ghost" data-act="go" data-v="home">홈</button><button class="btn" data-act="go" data-v="wrong">오답노트 보기</button></div>`};
V.wrong=()=>{const ids=DATA.wrongIds;return `<h1>오답노트</h1><p class="muted sm" style="margin:6px 0 18px">틀린 문제 ${ids.length}개</p>
  ${ids.length?ids.map(id=>{const q=byId(id),o=S.open[id];return `<div class="card"><div class="row between"><span class="badge bad">${q.s}</span><button class="muted sm" data-act="toggle" data-v="${id}">${o?"접기":"해설 보기"}</button></div>
  <p class="serif" style="margin:8px 0;white-space:pre-line">${q.q}</p>${o?`<div class="muted sm">${q.c.map((c,i)=>`<div style="${i==q.a?"color:var(--accent);font-weight:700":""}">${L[i]} ${c}</div>`).join("")}</div><div class="exp"><b>해설</b><br>${q.e}</div>`:""}</div>`}).join("")+`<button class="btn" data-act="retryWrong">오답만 다시 풀기</button>`
  :`<div class="card muted">아직 틀린 문제가 없어요. 문제를 풀고 오면 여기에 모여요.</div>`}`};
V.my=()=>{const u=DATA.user;return `<h1>마이페이지</h1>
  <div class="card row" style="margin-top:18px"><div class="cell" style="width:52px;aspect-ratio:1;border-radius:50%">${u.name[0]}</div><div class="grow"><b>${u.name}</b><div class="muted sm">목표 · ${u.goal}</div></div></div>
  <div class="card row"><div class="stat"><div class="num">${u.totalSolved}</div><small>누적 풀이</small></div><div class="stat"><div class="num">${u.accuracy}%</div><small>정답률</small></div><div class="stat"><div class="num">${u.streak}일</div><small>연속 학습</small></div></div>
  <h2>이용권 상태</h2><div class="card"><div class="row between"><b>과목별 이용권</b><span class="badge">이용 중</span></div><p class="muted sm" style="margin:6px 0 10px">${u.owned.join(" · ")} · ~${u.pass.until}</p><button class="btn ghost sm" data-act="go" data-v="pass">프리패스 알아보기</button></div>

A.deleteReal=d=>{if(!confirm('이 항목을 삭제할까요? 삭제한 내용은 복구할 수 없습니다.'))return;const id=d.v,seg=S.adminSeg;
 if(seg==='시험'){DATA.exams=DATA.exams.filter(e=>e.id!==id);DATA.papers=DATA.papers.filter(p=>p.exam!==id)}
 if(seg==='과목'){const [exam,subject]=id.split('|');const e=DATA.exams.find(e=>e.id===exam);if(e)e.subjects=e.subjects.filter(s=>s!==subject);DATA.papers=DATA.papers.filter(p=>!(p.exam===exam&&p.subject===subject))}
 if(seg==='시험지')DATA.papers=DATA.papers.filter(p=>p.id!==id);
 if(seg==='문항'){DATA.questions=DATA.questions.filter(q=>String(q.id)!==id);DATA.papers.forEach(p=>p.questionIds=p.questionIds.filter(x=>String(x)!==id));DATA.wrongIds=DATA.wrongIds.filter(x=>String(x)!==id)}
 persist();say('삭제했습니다')};
// 관리자 시험 선택 시 과목 선택지를 즉시 갱신
 document.addEventListener('change',e=>{if(e.target.id==='f_exam'&&S.adminSeg==='시험지'){S.adminExam=e.target.value;const opts=subOpts(S.adminExam);const el=document.getElementById('f_subject');if(el)el.innerHTML=opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}});
// 클릭 핸들러의 기존 리렌더링 동작과 호환

render();
</script>
</body>
</html>
