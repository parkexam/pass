 ];
 const papers=[],questions=[];
 for(const [examId,subName,body,options,answer,explanation] of samples){

  questions.push({id:uid('q'),paperId:paper.id,body,options,answer,explanation,imageUrl:''});

 return {version:2,exams,subjects,papers,questions,history:[],wrongIds:[],draft:null};
}

const papersIn = subj => db.papers.filter(p=>p.subjectId===subj);

const allSolved = ()=>db.history.reduce((n,h)=>n+h.total,0);
const allCorrect=()=>db.history.reduce((n,h)=>n+h.correct,0);
const accuracy=()=>allSolved()?Math.round(allCorrect()/allSolved()*100):null;
const todaySolved=()=>db.history.filter(h=>h.day===today()).reduce((n,h)=>n+h.total,0);
function nav(){return `<nav class="bottomnav" aria-label="하단 메뉴">${navs.map(([key,label,svg])=>`<button data-act="view" data-val="${key}" class="${S.view===key?'active':''}"><span class="navico"><svg viewBox="0 0 24 24">${svg}</svg></span>${label}</button>`).join('')}</nav>`}
function appHeader(){return `<div class="header row between"><div class="brand"><div class="logo">✦</div><div><div class="brandname">EXAM BANK</div><div class="eyebrow" style="font-size:9px;letter-spacing:.1em">Your next achievement</div></div></div><button class="avatar" data-act="view" data-val="my" aria-label="마이페이지">나</button></div>`}
function catCards(){return `<div class="cards">${db.exams.map((e,i)=>`<button class="cat" data-act="exam" data-val="${esc(e.id)}"><h3>${esc(e.name)}</h3><p>${esc(e.desc||'')}</p></button>`).join('')}</div>${db.exams.length?'':`<div class="empty">관리자 페이지에서 시험 분야를 등록해 주세요.</div>`}`}
function paperCard(p){let cnt=questionsIn(p.id).length,sub=subjectBy(p.subjectId);return `<button class="paper" data-act="paper" data-val="${esc(p.id)}"><span class="paperico">📘</span><span class="grow"><b>${esc(p.title)}</b><p>${esc(sub?.name||'')}${p.year?' · '+esc(p.year)+'년':''} · ${cnt}문항${p.isSample?' · 예시':''}</p></span><span class="arrow">›</span></button>`}
function statCards(){return `<div class="metrics"><div class="metric"><b>${allSolved()}</b><span>누적 풀이</span></div><div class="metric"><b>${accuracy()===null?'—':accuracy()+'%'}</b><span>평균 정답률</span></div><div class="metric"><b>${db.wrongIds.length}</b><span>복습할 오답</span></div></div>`}
function home(){let t=todaySolved(),n=db.questions.length,ring=Math.min(100,Math.round(t/20*100));let rec=db.history.slice(-2).reverse();return `${appHeader()}<div class="intro"><div class="eyebrow">${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',weekday:'long'}).toUpperCase()}</div><h1>오늘도 합격에<br>한 문제 더 가까이 👋</h1><p>작은 진전이 쌓여 큰 성취가 됩니다.</p></div><section class="hero"><div class="eyebrow">TODAY'S STUDY</div><h2>오늘의 학습을<br>시작해 볼까요?</h2><div style="font-size:12px;opacity:.83;margin-bottom:16px">오늘 ${t}문항 풀이 · 문제은행 ${n}문항</div><div class="hero-progress"><div class="ring" style="background:conic-gradient(#92e6d5 0 ${ring}%,#ffffff3c ${ring}% 100%)"><span>${ring}%</span></div></div><button class="cta" data-act="quick">${db.draft?'이어서 문제 풀기':'문제풀이 시작하기'} <span>↗</span></button></section>${statCards()}<div class="sectionbar"><h2>시험 분야 둘러보기</h2><button data-act="view" data-val="library" class="link">전체보기 →</button></div>${catCards()}<div class="sectionbar"><h2>추천 학습</h2><span class="tag">문제은행</span></div>${db.papers.filter(p=>questionsIn(p.id).length).slice(0,2).map(paperCard).join('')||`<div class="notice">관리자 화면에서 시험지를 만들고 문항을 추가해 주세요.</div>`}${rec.length?`<div class="sectionbar"><h2>최근 풀이</h2><button class="link" data-act="view" data-val="history">기록 보기 →</button></div>${rec.map(h=>`<button class="paper" data-act="historyDetail" data-val="${esc(h.id)}"><span class="paperico">📊</span><span class="grow"><b>${esc(h.title)}</b><p>${formatDay(h.time)} · ${h.correct}/${h.total} 정답</p></span><span class="arrow">›</span></button>`).join('')}`:''}`}
function library(){const e=examBy(S.examId);return `${appHeader()}<div class="eyebrow">QUESTION LIBRARY</div><h1 class="titleline">내 문제은행</h1><p class="description">시험을 선택하고 원하는 과목의 문제를 풀어보세요.</p>${!e?`${catCards()}<div class="sectionbar"><h2>등록된 시험지</h2><span class="tag">${db.papers.length}개</span></div>${db.papers.slice(0,4).map(paperCard).join('')}`:`<button class="back" data-act="backExams">← 시험 분야</button><div class="sectionbar" style="margin-top:14px"><h2>${esc(e.name)} 과목</h2><span class="tag">${db.subjects.filter(s=>s.examId===e.id).length}개 과목</span></div><div class="stack">${db.subjects.filter(s=>s.examId===e.id).map(sub=>`<button class="listrow" data-act="subject" data-val="${esc(sub.id)}"><span class="paperico" style="width:42px;height:42px">📄</span><span class="grow"><b>${esc(sub.name)}</b><small>${papersIn(sub.id).length}개 시험지 · ${papersIn(sub.id).reduce((n,p)=>n+questionsIn(p.id).length,0)}개 문항</small></span><span class="arrow">›</span></button>`).join('')||'<div class="empty">등록된 과목이 없습니다.</div>'}</div>`}`}
function subject(){const s=subjectBy(S.subjectId);if(!s)return emptyGo('과목을 찾을 수 없어요.');const papers=papersIn(s.id).sort((a,b)=>(Number(b.year)||0)-(Number(a.year)||0));return `${appHeader()}<button class="back" data-act="backSubjects">← 과목 목록</button><h1 class="titleline">${esc(s.name)}</h1><p class="description">원하는 시험지를 선택하고 풀이를 시작하세요.</p><div class="row between" style="margin-bottom:13px"><span class="tag">${esc(examBy(s.examId)?.name||'')}</span><span class="muted small">${papers.length}개 시험지</span></div>${papers.map(paperCard).join('')||`<div class="panel"><b>아직 시험지가 없어요</b><p>관리자 → 시험지 메뉴에서 이 과목의 시험지를 추가할 수 있습니다.</p></div>`}<div class="panel"><b>학습 흐름</b><div style="margin-top:9px;font-size:12px;color:var(--muted)">문제풀이 → 일괄 채점 / 즉시 채점 → 정오표 → 오답 복습</div></div>`}
function paper(){const p=paperBy(S.paperId);if(!p)return emptyGo('시험지를 찾을 수 없어요.');const questions=questionsIn(p.id),s=subjectBy(p.subjectId);return `${appHeader()}<button class="back" data-act="backPapers">← 시험지 목록</button><div class="eyebrow" style="margin-top:10px">EXAM PAPER</div><h1 class="titleline">${esc(p.title)}</h1><p class="description">${esc(s?.name||'')} · ${p.year?esc(p.year)+'년 · ':''}${questions.length}문항</p><div class="panel"><div class="row between"><b>시험지 안내</b><span class="tag green">${questions.length}문항</span></div><p style="margin-top:12px">${esc(p.source||'등록된 시험지')}</p>${p.isSample?`<p style="margin-top:7px;color:#ad612d">이 문항은 기능 체험용 예시이며 실제 기출문제가 아닙니다.</p>`:''}</div>${questions.length?`<div class="panel"><b>채점 방식 선택</b><div class="radio-row" style="margin-top:12px"><label><input type="radio" name="mode" value="batch" checked> 일괄 채점</label><label><input type="radio" name="mode" value="instant"> 문제별 즉시 확인</label></div><p style="margin-top:9px">일괄 채점은 제출 후 정답과 해설을 공개합니다.</p></div><button class="btn full" data-act="startPaper" data-val="${esc(p.id)}">${db.draft?.paperId===p.id?'이어 풀기':'문제풀이 시작하기'} →</button>`:`<div class="notice">시험지에 문항이 아직 등록되지 않았습니다.</div>`}`}
function emptyGo(message){return `${appHeader()}<div class="empty">${esc(message)}<br><button class="btn" data-act="view" data-val="library" style="margin-top:18px">문제은행으로</button></div>`}
function getAttempt(){return S.attempt||db.draft}
function quiz(){const z=getAttempt();if(!z||!z.items.length)return emptyGo('진행 중인 시험이 없습니다.');const q=z.items[z.index],n=z.items.length,answered=z.answers.filter(x=>x!==null).length,choice=z.answers[z.index],checked=z.mode==='instant'&&z.checked[z.index];return `<div class="quizhead"><button data-act="quit" class="exit" aria-label="문제풀이 종료">×</button><div><b>${esc(z.title)}</b><div class="muted small" style="text-align:center">문제 ${z.index+1} / ${n}</div></div><span class="tag green">${answered}/${n} 응답</span></div><div class="progress"><span style="width:${((z.index+1)/n)*100}%"></span></div><section class="question"><div class="row between"><span class="questionnumber">QUESTION ${String(z.index+1).padStart(2,'0')}</span><span class="tag">${esc(z.subjectName||'문제풀이')}</span></div><div class="questiontext">${esc(q.body)}</div>${safeImg(q.imageUrl)?`<img class="qimage" src="${esc(safeImg(q.imageUrl))}" alt="문제 참고 이미지" loading="lazy">`:''}${q.options.map((txt,i)=>`<button class="option ${choice===i?'selected':''} ${checked&&i===q.answer?'correct':''} ${checked&&choice===i&&choice!==q.answer?'wrongpick':''}" data-act="answer" data-val="${i}" ${checked?'disabled':''}><span class="number">${i+1}</span><span>${esc(txt)}</span></button>`).join('')}${checked?`<div class="explain"><b>${choice===q.answer?'✅ 정답입니다':'❌ 오답입니다'}</b><div style="margin-top:7px">정답: ${q.answer+1}번</div><div style="margin-top:7px;white-space:pre-line">${esc(q.explanation||'등록된 해설이 없습니다.')}</div></div>`:''}</section><button class="link" data-act="palette" style="margin:18px 0 0">▦ 전체 문항 이동</button>${S.showPalette?`<div class="panel"><b>문항 목록</b><div class="overview">${z.items.map((q,i)=>`<button class="${z.answers[i]!==null?'answered':''} ${z.index===i?'current':''}" data-act="jump" data-val="${i}">${i+1}</button>`).join('')}</div></div>`:''}<div class="quizbottom"><button class="btn ghost" data-act="prev" ${z.index===0?'disabled':''}>이전</button>${z.index<n-1?`<button class="btn" data-act="next">다음 문제 →</button>`:`<button class="btn" data-act="submit">${z.mode==='instant'?'풀이 완료':'일괄 채점하기'} ✓</button>`}</div>`}
function result(){const h=S.result;if(!h)return emptyGo('채점 결과가 없습니다.');const ok=h.correct,n=h.total;return `<button class="back" data-act="view" data-val="home">← 홈으로</button><div class="eyebrow" style="margin-top:16px">RESULT SUMMARY</div><h1 class="titleline">시험이 끝났어요!</h1><p class="description">정오표를 확인하고 틀린 문제를 복습해 보세요.</p><div class="scorecard"><span class="small">나의 점수</span><div class="big">${Math.round(ok/n*100)}<small> / 100점</small></div><div class="row between" style="opacity:.85"><span>정답 ${ok}문항 · 오답 ${n-ok}문항</span><span>${n}문항 응시</span></div></div><div class="sectionbar"><h2>문항별 정오표</h2><span class="tag">눌러서 해설 확인</span></div><div class="panel">${h.items.map((q,i)=>`<button class="resultrow" style="width:100%;text-align:left" data-act="review" data-val="${i}"><span class="row"><span class="circle ${h.answers[i]===q.answer?'ok':'no'}">${h.answers[i]===q.answer?'✓':'×'}</span><b>${i+1}번 · ${esc(q.subjectName||'문제')}</b></span><span class="muted small">${h.answers[i]===null?'미응답':'선택 '+(h.answers[i]+1)+'번'} ›</span></button>${S.reviewId===i?`<div class="explain"><b style="white-space:pre-line">${esc(q.body)}</b>${safeImg(q.imageUrl)?`<img class="qimage" src="${esc(safeImg(q.imageUrl))}" alt="문제 참고 이미지">`:''}<div style="margin-top:9px">${q.options.map((o,j)=>`<div style="margin:3px 0;${j===q.answer?'font-weight:800;color:#087d73':''}">${j+1}. ${esc(o)}</div>`).join('')}</div><p style="margin-top:8px">내 답안: ${h.answers[i]===null?'미응답':(h.answers[i]+1)+'번'} · 정답: ${q.answer+1}번</p><div style="margin-top:8px;white-space:pre-line">${esc(q.explanation||'등록된 해설이 없습니다.')}</div></div>`:''}`).join('')}</div><button class="btn full" data-act="view" data-val="wrong">오답노트 확인하기</button><button class="btn ghost full" data-act="view" data-val="history" style="margin-top:10px">전체 풀이 기록</button>`}
function wrong(){let all=db.questions.filter(q=>db.wrongIds.includes(q.id));const subs=[...new Set(all.map(q=>paperBy(q.paperId)?.subjectId).filter(Boolean))];let filter=all.filter(q=>S.wrongFilter==='전체'||paperBy(q.paperId)?.subjectId===S.wrongFilter);return `${appHeader()}<div class="eyebrow">REVIEW NOTE</div><h1 class="titleline">오답노트</h1><p class="description">틀린 문제를 다시 풀어보며 실력을 쌓아보세요.</p><div class="panel row between"><div><span class="muted small">현재 복습할 문제</span><div style="font-weight:900;font-size:28px">${all.length}<span style="font-size:13px;color:var(--muted)"> 문항</span></div></div><div style="font-size:33px">🗂️</div></div>${subs.length>1?`<div class="filterchips"><button data-act="wrongFilter" data-val="전체" class="${S.wrongFilter==='전체'?'on':''}">전체</button>${subs.map(id=>`<button class="${S.wrongFilter===id?'on':''}" data-act="wrongFilter" data-val="${esc(id)}">${esc(subjectBy(id)?.name||'과목')}</button>`).join('')}</div>`:''}${filter.map((q,i)=>`<div class="panel"><div class="row between"><span class="tag">${esc(subjectBy(paperBy(q.paperId)?.subjectId)?.name||'과목')}</span><span class="muted small">문제 ${i+1}</span></div><h3 style="margin:12px 0;white-space:pre-line">${esc(q.body)}</h3><button class="link" data-act="wrongReview" data-val="${esc(q.id)}">${S.reviewId===q.id?'해설 접기':'정답 및 해설 확인 →'}</button>${S.reviewId===q.id?`<div class="explain">${q.options.map((t,j)=>`<div style="${j===q.answer?'color:#087d73;font-weight:800':''}">${j+1}. ${esc(t)}</div>`).join('')}<div style="margin-top:8px"><b>정답: ${q.answer+1}번</b></div><div style="white-space:pre-line;margin-top:7px">${esc(q.explanation||'등록된 해설이 없습니다.')}</div></div>`:''}</div>`).join('')||'<div class="empty"><div class="bigemoji">🎉</div><b>복습할 오답이 없어요</b><p>틀린 문제를 풀면 여기에 자동 저장됩니다.</p></div>'}${filter.length?`<button class="btn full" data-act="retry">오답 ${filter.length}문항 다시 풀기</button>`:''}`}
function history(){return `${appHeader()}<button class="back" data-act="view" data-val="my">← 마이페이지</button><h1 class="titleline">풀이 기록</h1><p class="description">응시 결과를 다시 확인할 수 있어요.</p>${db.history.slice().reverse().map(h=>`<button class="paper" data-act="historyDetail" data-val="${esc(h.id)}"><span class="paperico">📊</span><span class="grow"><b>${esc(h.title)}</b><p>${formatDay(h.time)} · ${h.correct}/${h.total} 정답 · ${Math.round(h.correct/h.total*100)}점</p></span><span class="arrow">›</span></button>`).join('')||'<div class="empty">아직 풀이 기록이 없습니다.</div>'}`}
function pass(){return `${appHeader()}<button class="back" data-act="view" data-val="my">← 마이페이지</button><div class="eyebrow" style="margin-top:16px">MEMBERSHIP PLANS</div><h1 class="titleline">나에게 맞는 이용권</h1><p class="description">과목별 선택 구매부터 전체 프리패스까지.</p>${prices.map((p,i)=>`<div class="passcard ${i===2?'featured':''}"><div class="row between"><b>${p[0]}</b>${i===2?'<span class="tag green">추천</span>':'<span class="tag">예시 요금</span>'}</div><div class="price">${p[1]}<small> / ${p[2]}</small></div><p class="muted small" style="margin-bottom:15px">${p[3]}</p><button class="btn ${i===0?'soft':''} full" data-act="buy">이용권 살펴보기</button></div>`).join('')}<p class="notice">※ 가격은 구조 검토용 예시입니다. 실제 결제·접근 제한은 없으며, 정식 출시 때 인증 서버와 인앱결제를 연결해야 합니다.</p>`}
function my(){return `${appHeader()}<div class="eyebrow">MY LEARNING</div><h1 class="titleline">마이페이지</h1><div class="panel profile" style="margin-top:18px"><div class="avatar">나</div><div class="grow"><b>체험 사용자</b><div class="muted small">이 기기의 브라우저에 학습 데이터 저장</div></div><span class="tag green">개발판</span></div>${statCards()}<div class="sectionbar"><h2>학습 관리</h2></div><button class="paper" data-act="view" data-val="history"><span class="paperico">📊</span><span class="grow"><b>전체 풀이 기록</b><p>${db.history.length}회 응시 · 정답 해설 다시 보기</p></span><span class="arrow">›</span></button><button class="paper" data-act="view" data-val="pass"><span class="paperico">👑</span><span class="grow"><b>이용권 · 프리패스</b><p>과목별 이용권, 전체 프리패스 (출시 예정)</p></span><span class="arrow">›</span></button><button class="paper" data-act="view" data-val="admin"><span class="paperico">⚙️</span><span class="grow"><b>관리자 · 문제은행 편집</b><p>시험·과목·시험지·문항 등록 및 수정</p></span><span class="arrow">›</span></button><div class="panel"><h3>데이터 백업</h3><p style="margin-bottom:14px">저장 내용은 현재 브라우저에만 남습니다. 기기 변경 전에 파일로 백업해 주세요.</p><div class="row" style="align-items:stretch"><button class="btn soft grow" data-act="export">⬇ 내보내기</button><button class="btn ghost grow" data-act="importStart">⬆ 복원하기</button></div><input id="jsonImport" type="file" accept=".json,application/json" hidden></div><div class="notice">${storageOK?'Firebase 로그인과 사용자 간 동기화는 아직 연결되지 않았습니다.':'⚠️ '+errText} 관리자 화면은 개발용으로 누구나 열 수 있습니다. 정식 서비스 이전에는 서버 인증과 접근권한을 추가해야 합니다.</div>`}
function optionsFor(type,selected){let list=type==='exam'?db.exams:type==='subject'?db.subjects:type==='paper'?db.papers:[];return list.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${type==='exam'?esc(x.name):type==='subject'?esc(subLabel(x.id)):esc(x.title+' · '+(subjectBy(x.subjectId)?.name||''))}</option>`).join('')}
function field(label,name,value='',kind='input',rest=''){return `<label for="f_${name}">${label}</label>${kind==='textarea'?`<textarea id="f_${name}" name="${name}" ${rest}>${esc(value)}</textarea>`:`<input id="f_${name}" name="${name}" value="${esc(value)}" ${rest}>`}`}
function editorForm(){const tab=S.adminTab,old=S.editId?({'시험':db.exams,'과목':db.subjects,'시험지':db.papers,'문항':db.questions}[tab].find(x=>x.id===S.editId)):null;let f='';
 if(tab==='시험')f=field('시험 분야 이름 *','name',old?.name||'','input','required maxlength="90"')+field('설명','desc',old?.desc||'','input','maxlength="160"')+field('아이콘 (이모지)','icon',old?.icon||'📘','input','maxlength="6"');
 if(tab==='과목')f=`<label for="f_examId">시험 분야 *</label><select id="f_examId" name="examId" required>${optionsFor('exam',old?.examId)}</select>`+field('과목 이름 *','name',old?.name||'','input','required maxlength="90"');
 if(tab==='시험지')f=`<label for="f_subjectId">소속 과목 *</label><select id="f_subjectId" name="subjectId" required>${optionsFor('subject',old?.subjectId)}</select>`+field('시험지 이름 *','title',old?.title||'','input','required maxlength="150"')+field('연도 (선택)','year',old?.year??new Date().getFullYear(),'input','type="number" min="1900" max="2200"')+field('출처 / 회차 / 설명','source',old?.source||'','input','maxlength="250"');
 if(tab==='문항')f=`<label for="f_paperId">시험지 *</label><select id="f_paperId" name="paperId" required>${optionsFor('paper',old?.paperId)}</select>`+field('문제 지문 *','body',old?.body||'','textarea','rows="5" required')+field('선택지 (한 줄에 하나씩, 2~5개) *','options',old?.options.join('\n')||'','textarea','rows="5" required')+`<label for="f_answer">정답 번호 *</label><select id="f_answer" name="answer" required>${[1,2,3,4,5].map(i=>`<option value="${i}" ${i===(old?old.answer+1:1)?'selected':''}>${i}번</option>`).join('')}</select>`+field('해설','explanation',old?.explanation||'','textarea','rows="4"')+field('문제 이미지 주소 (HTTPS, 선택)','imageUrl',old?.imageUrl||'','input','placeholder="https://..."');
 return `<form class="adminbox" id="adminEditor"><h3 style="margin:0 0 5px">${tab} ${old?'수정':'신규 등록'}</h3><p class="muted small" style="margin-bottom:14px">실제로 저장되며, 이 브라우저에서 즉시 시험에 반영됩니다.</p>${f}<div class="row"><button class="btn grow" type="submit">${old?'수정 저장':'등록하기'}</button>${old?`<button class="btn ghost" type="button" data-act="adminCancel">취소</button>`:''}</div></form>`;
}
function adminList(){const tab=S.adminTab;const types={시험:db.exams,과목:db.subjects,시험지:db.papers,문항:db.questions};let list=types[tab];if(tab==='문항'&&S.adminFilter)list=list.filter(q=>q.paperId===S.adminFilter);const label=x=>tab==='시험'?x.name:tab==='과목'?x.name:tab==='시험지'?x.title:x.body.slice(0,60);const detail=x=>tab==='시험'?`${db.subjects.filter(s=>s.examId===x.id).length}개 과목`:tab==='과목'?subLabel(x.id):tab==='시험지'?`${questionsIn(x.id).length}개 문항 · ${subLabel(x.subjectId)}`:`${esc(paperBy(x.paperId)?.title||'')} · 정답 ${x.answer+1}번`;return `${tab==='문항'&&db.papers.length?`<label>문항 목록 필터</label><select id="adminFilter"><option value="">전체 시험지</option>${db.papers.map(p=>`<option value="${esc(p.id)}" ${S.adminFilter===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`:''}<div class="sectionbar"><h2>등록된 ${tab}</h2><span class="tag">${list.length}개</span></div>${list.map(x=>`<div class="manage-row"><div class="grow"><b>${esc(label(x))}</b><small>${tab==='문항'?detail(x):esc(detail(x))}</small></div><button class="action-btn" data-act="edit" data-val="${esc(x.id)}">수정</button><button class="action-btn danger" data-act="delete" data-val="${esc(x.id)}">삭제</button></div>`).join('')||'<div class="empty">등록된 항목이 없습니다.</div>'}`}
function admin(){let labels=['시험','과목','시험지','문항'];return `${appHeader()}<button class="back" data-act="view" data-val="my">← 마이페이지</button><h1 class="titleline">콘텐츠 관리</h1><p class="description">시험 종류가 늘어나도 관리자 화면에서 직접 추가할 수 있어요.</p><div class="notice" style="margin-bottom:18px">개발용 로컬 관리자입니다. 이 브라우저에만 저장되며, 아직 회원 권한 검사가 없습니다.</div><div class="filterchips">${labels.map(x=>`<button data-act="adminTab" data-val="${x}" class="${S.adminTab===x?'on':''}">${x}</button>`).join('')}</div>${editorForm()}${adminList()}${S.adminTab==='문항'&&db.papers.length?`<div class="panel" style="margin-top:18px"><h3>CSV 문항 일괄 등록</h3><p>한 시험지에 여러 문항을 추가할 수 있습니다. 첫 행에는 열 이름이 필요합니다.</p><label for="csvPaper">등록 대상 시험지</label><select id="csvPaper">${optionsFor('paper','')}</select><div class="row"><button class="btn ghost grow" data-act="csvTemplate">CSV 양식 내려받기</button><button class="btn soft grow" data-act="csvStart">CSV 파일 선택</button></div><input type="file" id="csvImport" accept=".csv,text/csv" hidden></div>`:''}`}
function snapshot(q){const paper=paperBy(q.paperId);const subj=subjectBy(paper?.subjectId);return {id:q.id,paperId:q.paperId,subjectId:subj?.id||'',subjectName:subj?.name||'과목',body:q.body,options:[...q.options],answer:q.answer,explanation:q.explanation||'',imageUrl:q.imageUrl||''}}
function startQuiz(items,title,paperId=null,mode='batch',source='paper'){if(!items.length){toast('등록된 문항이 없습니다.');return}let z={id:uid('attempt'),title,paperId,mode,source,items:items.map(snapshot),answers:items.map(()=>null),checked:items.map(()=>false),index:0,started:Date.now()};S.attempt=z;db.draft=z;persist();S.reviewId=null;S.showPalette=false;S.view='quiz';render()}
function grade(){const z=getAttempt();if(!z)return;const missing=z.answers.filter(x=>x===null).length;if(missing&&!confirm(`미응답 ${missing}문항이 있습니다. 그대로 채점할까요?`))return;const correct=z.items.reduce((n,q,i)=>n+(z.answers[i]===q.answer?1:0),0);const h={id:uid('history'),title:z.title,paperId:z.paperId,source:z.source,day:today(),time:Date.now(),total:z.items.length,correct,items:z.items,answers:[...z.answers]};for(let i=0;i<z.items.length;i++){let id=z.items[i].id,wi=db.wrongIds.indexOf(id);if(z.answers[i]===z.items[i].answer){if(wi>=0)db.wrongIds.splice(wi,1)}else if(wi<0)db.wrongIds.push(id)}db.history.push(h);db.draft=null;S.attempt=null;S.result=h;S.reviewId=null;S.view='result';persist();render()}
function deleteRecord(id){let tab=S.adminTab,type={'시험':'exams','과목':'subjects','시험지':'papers','문항':'questions'}[tab],list=db[type],item=list.find(x=>x.id===id);if(!item)return;let subIds=tab==='시험'?db.subjects.filter(s=>s.examId===id).map(s=>s.id):tab==='과목'?[id]:[];let paperIds=(subIds.length?db.papers.filter(p=>subIds.includes(p.subjectId)).map(p=>p.id):tab==='시험지'?[id]:[]);let questionIds=paperIds.length?db.questions.filter(q=>paperIds.includes(q.paperId)).map(q=>q.id):tab==='문항'?[id]:[];if(!confirm(`${tab} '${tab==='시험'?item.name:tab==='과목'?item.name:tab==='시험지'?item.title:item.body.slice(0,20)}' 삭제?${questionIds.length?`\n연결된 문항 ${questionIds.length}개도 삭제됩니다.`:''}\n삭제된 문항은 복구할 수 없으니 필요하면 백업하세요.`))return;
 db[type]=list.filter(x=>x.id!==id);if(subIds.length)db.subjects=db.subjects.filter(s=>!subIds.includes(s.id));if(paperIds.length)db.papers=db.papers.filter(p=>!paperIds.includes(p.id));if(questionIds.length){db.questions=db.questions.filter(q=>!questionIds.includes(q.id));db.wrongIds=db.wrongIds.filter(w=>!questionIds.includes(w));}S.editId=null;persist();render(true);toast('삭제했습니다. 기존 풀이 기록은 유지됩니다.')}
function saveEditor(form){const raw=Object.fromEntries(new FormData(form).entries());let tab=S.adminTab,type={'시험':'exams','과목':'subjects','시험지':'papers','문항':'questions'}[tab];let item;
 if(tab==='시험'){if(!raw.name.trim())throw Error('시험 이름을 입력해 주세요.');item={name:raw.name.trim(),desc:raw.desc.trim(),icon:raw.icon.trim()||'📚'}}
 if(tab==='과목'){if(!examBy(raw.examId)||!raw.name.trim())throw Error('시험 분야와 과목 이름을 확인해 주세요.');item={examId:raw.examId,name:raw.name.trim()}}
 if(tab==='시험지'){if(!subjectBy(raw.subjectId)||!raw.title.trim())throw Error('과목과 시험지 이름을 확인해 주세요.');item={subjectId:raw.subjectId,title:raw.title.trim(),year:raw.year?Number(raw.year):null,source:raw.source.trim(),isSample:false}}
 if(tab==='문항'){const opts=raw.options.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let answer=Number(raw.answer)-1;if(!paperBy(raw.paperId))throw Error('시험지를 선택해 주세요.');if(!raw.body.trim())throw Error('문제를 입력해 주세요.');if(opts.length<2||opts.length>5)throw Error('선택지는 2~5개로 입력해 주세요.');if(answer<0||answer>=opts.length)throw Error('정답 번호가 보기 개수를 초과했습니다.');if(raw.imageUrl.trim()&&!safeImg(raw.imageUrl))throw Error('문제 이미지 주소는 https:// 로 시작해야 합니다.');item={paperId:raw.paperId,body:raw.body.trim(),options:opts,answer,explanation:raw.explanation.trim(),imageUrl:raw.imageUrl.trim()}}
 let existing=db[type].find(x=>x.id===S.editId);if(existing){Object.assign(existing,item);if(tab==='시험지'&&existing.isSample)item.isSample=false;}else db[type].push({id:uid(type),...item});S.editId=null;persist();render(true);toast('저장했습니다. 문제은행에 반영됐어요.');}
function csvEncodeCell(v){const x=String(v??'');return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function downloadBlob(name,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportDb(){downloadBlob('EXAM_BANK_백업_'+today()+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8')}
function parseCsv(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],value='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){value+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=c}if(quote)throw Error('CSV 따옴표가 닫히지 않았습니다.');row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importCsv(file){const paperId=$('#csvPaper')?.value;if(!paperBy(paperId))throw Error('등록할 시험지를 선택해 주세요.');const rows=parseCsv(await file.text());if(rows.length<2)throw Error('CSV에 등록할 문항이 없습니다.');const headers=rows.shift().map(x=>x.trim().toLowerCase());const required=['question','option1','option2','answer'];for(const x of required)if(!headers.includes(x))throw Error('필수 열이 없습니다: '+x);let inserted=[];for(let i=0;i<rows.length;i++){let obj={};headers.forEach((h,j)=>obj[h]=(rows[i][j]||'').trim());const opts=[1,2,3,4,5].map(k=>obj['option'+k]||'').filter(Boolean);const ans=Number(obj.answer)-1;if(!obj.question||opts.length<2||opts.length>5||!Number.isInteger(ans)||ans<0||ans>=opts.length)throw Error(`CSV ${i+2}행 문제/선택지/정답을 확인해 주세요.`);const image=obj.imageurl||'';if(image&&!safeImg(image))throw Error(`CSV ${i+2}행 이미지 주소는 HTTPS만 허용합니다.`);inserted.push({id:uid('q'),paperId,body:obj.question,options:opts,answer:ans,explanation:obj.explanation||'',imageUrl:image})}if(!confirm(`${inserted.length}문항을 현재 시험지에 일괄 등록할까요?`))return;db.questions.push(...inserted);persist();S.adminTab='문항';render(true);toast(`${inserted.length}문항을 등록했어요.`)}
async function importJson(file){let incoming;try{incoming=JSON.parse(await file.text())}catch(e){throw Error('JSON 파일을 읽을 수 없습니다.')}if(!incoming||!['exams','subjects','papers','questions','history','wrongIds'].every(k=>Array.isArray(incoming[k])))throw Error('EXAM BANK 백업 형식이 아닙니다.');if(!confirm(`백업을 복원하면 현재 기기의 시험·문항·풀이 기록을 덮어씁니다.\n현재 데이터를 먼저 내보내는 것을 권장합니다. 계속할까요?`))return;db=incoming;db.draft=null;S.attempt=null;S.view='home';persist();render();toast('백업을 복원했어요.')}
function toast(message){let el=$('#toast');if(el)el.remove();el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1f2d52;color:white;border-radius:14px;padding:12px 18px;font-size:12px;z-index:200;max-width:90vw;text-align:center;box-shadow:0 7px 28px #15264260';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function render(preserve=false){let y=scrollY;let content={home,library,subject,paper,quiz,result,wrong,history,pass,my,admin}[S.view]?.()||home();let quiet=['quiz','result','subject','paper','pass','admin','history'].includes(S.view);$('#app').innerHTML=`<main class="page ${S.view==='quiz'?'padded':''}">${content}</main>${quiet?'':nav()}`;if(S.view==='quiz')$('.page').classList.add('padded');scrollTo({top:preserve?y:0,behavior:'instant'})}
function go(view){S.view=view;S.reviewId=null;render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.val;let keep=false;
 if(a==='view'){S.view=v;S.reviewId=null;if(v==='library')S.examId=null;}
 else if(a==='exam'){S.examId=v;S.view='library'}
 else if(a==='backExams'){S.examId=null}
 else if(a==='subject'){S.subjectId=v;S.view='subject'}
 else if(a==='backSubjects'){S.view='library'}
 else if(a==='paper'){S.paperId=v;S.view='paper'}
 else if(a==='backPapers'){S.subjectId=paperBy(S.paperId)?.subjectId||S.subjectId;S.view='subject'}
 else if(a==='startPaper'){const p=paperBy(v);if(p){let mode=$('input[name="mode"]:checked')?.value||'batch';if(db.draft?.paperId===p.id&&confirm('저장된 풀이를 이어서 진행할까요?\n[취소] 새로 시작')){S.attempt=db.draft;S.view='quiz'}else startQuiz(questionsIn(p.id),p.title,p.id,mode);}}
 else if(a==='quick'){if(db.draft){S.attempt=db.draft;S.view='quiz'}else{S.examId=null;S.view='library'}}
 else if(a==='answer'){let z=getAttempt();if(z&&!(z.mode==='instant'&&z.checked[z.index])){z.answers[z.index]=Number(v);if(z.mode==='instant')z.checked[z.index]=true;db.draft=z;persist();keep=true}}
 else if(a==='next'||a==='prev'){let z=getAttempt();if(z){z.index=Math.max(0,Math.min(z.items.length-1,z.index+(a==='next'?1:-1)));db.draft=z;persist()}}
 else if(a==='palette'){S.showPalette=!S.showPalette;keep=true}
 else if(a==='jump'){let z=getAttempt();if(z){z.index=Number(v);db.draft=z;persist();keep=true}}
 else if(a==='quit'){if(confirm('현재 풀이를 저장하고 나갈까요?')){S.attempt=null;S.view='home'}else return}
 else if(a==='submit'){grade();return}
 else if(a==='review'){S.reviewId=S.reviewId===Number(v)?null:Number(v);keep=true}
 else if(a==='wrongReview'){S.reviewId=S.reviewId===v?null:v;keep=true}
 else if(a==='wrongFilter'){S.wrongFilter=v;keep=true}
 else if(a==='retry'){const list=db.questions.filter(q=>db.wrongIds.includes(q.id)&&(S.wrongFilter==='전체'||paperBy(q.paperId)?.subjectId===S.wrongFilter));startQuiz(list,'오답 복습',null,'batch','wrong');return}
 else if(a==='historyDetail'){const item=db.history.find(h=>h.id===v);if(item){S.result=item;S.reviewId=null;S.view='result'}}
 else if(a==='adminTab'){S.adminTab=v;S.editId=null;S.adminFilter='';keep=true}
 else if(a==='adminCancel'){S.editId=null;keep=true}
 else if(a==='edit'){S.editId=v;keep=false}
 else if(a==='delete'){deleteRecord(v);return}
 else if(a==='buy'){toast('결제는 정식 출시 단계에서 연결할 예정입니다.');return}
 else if(a==='export'){exportDb();toast('백업 파일을 저장했습니다.');return}
 else if(a==='importStart'){$('#jsonImport')?.click();return}
 else if(a==='csvStart'){$('#csvImport')?.click();return}
 else if(a==='csvTemplate'){const header=['question','option1','option2','option3','option4','option5','answer','explanation','imageUrl'];const example=['예시 문제: 2 + 2는?', '3','4','5','','','2','정답은 4입니다.',''];downloadBlob('EXAM_BANK_CSV_문항등록_양식.csv','\uFEFF'+[header,example].map(r=>r.map(csvEncodeCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');return}
 render(keep);
});
document.addEventListener('submit',e=>{if(e.target.id==='adminEditor'){e.preventDefault();try{saveEditor(e.target)}catch(err){toast(err.message||'입력 내용을 확인해 주세요.')}}});
document.addEventListener('change',async e=>{if(e.target.id==='adminFilter'){S.adminFilter=e.target.value;render(true)}else if(['jsonImport','csvImport'].includes(e.target.id)){const file=e.target.files?.[0];if(!file)return;try{if(e.target.id==='jsonImport')await importJson(file);else await importCsv(file);}catch(err){alert(err.message||'파일 처리 중 오류가 발생했습니다.')}finally{e.target.value=''}}});
render();

</script></body></html>
